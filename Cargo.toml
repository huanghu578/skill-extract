[package]
name = "skill-extract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Configuration-driven key-value extraction framework"
repository = "https://github.com/huanghu578/skill-extract"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "skill_extract"
path = "src/lib.rs"

[[bin]]
name = "skill-extract"
path = "src/bin/skill-extract.rs"